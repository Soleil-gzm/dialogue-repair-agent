# =============================================================
# Dialogue Repair Agent — docker compose 一键起
# =============================================================
#
# 模型名与端点因机器而异，统一写在 .env（参考 .env.example），此处不硬编码。
#
# 首次使用：
#   1. cp .env.example .env，按本机改 DEEPSEEK_MODEL / JUDGE_MODEL（Ollama 模型名各机不同）
#   2. docker compose up -d --build
#   3. docker compose exec ollama pull "$(grep '^JUDGE_MODEL=' .env | cut -d= -f2)"
#   4. curl http://127.0.0.1:8000/health
#
# 停止：docker compose down      数据卷保留
# 清数据：docker compose down -v  连带 Ollama 模型一起删
#
# GPU 透传（宿主机有 NVIDIA GPU 且装了 nvidia-container-toolkit 时）：
#   取消 ollama 服务下 device_ids 注释即可。
# =============================================================

services:
  # ---------- Ollama 本地模型服务 ----------
  ollama:
    image: ollama/ollama:latest
    container_name: dr-ollama
    volumes:
      - ollama_models:/root/.ollama
    # device_ids: ['0']
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "0"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://127.0.0.1:11434/api/tags | grep -q models || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    ports:
      - "11434:11434"
    networks:
      - dr-net

  # ---------- API 服务 ----------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dr-api
    depends_on:
      ollama:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # 只覆盖"容器内网地址"这一项；模型名/密钥全部沿用 .env，不在 compose 里写死。
      # 不同机器各自在 .env 配 DEEPSEEK_MODEL / JUDGE_MODEL 即可。
      DEEPSEEK_BASE_URL: http://ollama:11434/v1
      RAG_OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "8000:8000"
    networks:
      - dr-net

# Ollama 模型持久化数据卷
volumes:
  ollama_models:
    name: dr-ollama-models

# 服务间专用网络（api 和 ollama 通过这个网络用服务名互访）
networks:
  dr-net:
    name: dr-network
