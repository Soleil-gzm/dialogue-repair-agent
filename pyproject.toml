[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dialogue-repair-agent"
version = "0.1.0"
description = "Reproducible agent evaluation for dialogue data repair"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["llm", "agent", "evaluation", "benchmark", "dialogue"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
# 真实调用才需要；核心评测与规则校验为零依赖
llm = ["httpx>=0.27", "tenacity>=8"]

[project.urls]
Repository = "https://github.com/Soleil-gzm/dialogue-repair-agent"

[tool.setuptools]
packages = ["agent", "agent.benchmark", "agent.eval", "agent.tools", "agent.runtime", "agent.tests", "agent.tests.benchmark"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["agent/tests"]
addopts = "-ra -q"
